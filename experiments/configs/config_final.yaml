# Final Benchmarking Sweep Configuration for Pre-Registration (prereg-v4)
# One primary dataset: extended grid with ALL methods needed by hypotheses over LHS+OFAT with n=50 per family.

benchmark_name: "aca_primary_evaluation"
preregistration_tag: "prereg-v4"

# Experimental Design:
# Independent instances are indexed by (family, seed).
pilot_seeds_range: [10000, 10009]
final_seeds: 50 # 5 families x 50 seeds = 250 independent instances

max_steps: 80

environments:
  # Real environments (MovingAI warehouse MAPF benchmark & OSMnx Boston road network)
  - family: "warehouse_movingai"
    n_nodes: 38
  - family: "road_osmnx"
    n_nodes: 216
  # Synthetic benchmark stress test families
  - family: "rgg"
    n_nodes: 35
  - family: "warehouse"
    n_nodes: 30
  - family: "er"
    n_nodes: 35

adversaries:
  - "theta_1_stochastic"
  - "theta_2_reactive"
  - "theta_3_budgeted_interdiction"
  - "theta_4_cyclic_patrol"

methods:
  # Proposed method and ablations
  - "aca"
  - "aca_depth_0"
  - "aca_depth_2"
  - "aca_no_inference"
  - "aca_no_margin"
  # Literature baselines
  - "cbba"
  - "cbba_lr"
  - "cbba_partial"
  - "cbba_partial_lr"
  - "ssi"
  - "ssi_lr"
  - "ctp_replan"
  - "implicit"
  - "clairvoyant_greedy"
  - "foresight_opt"
  # Kappa sweep
  - "aca_kappa_0"
  - "aca_kappa_0.1"
  - "aca_kappa_0.25"
  - "aca_kappa_0.5"
  - "aca_kappa_1"
  - "aca_kappa_2"

comm_regimes:
  benign:
    comm_range: 50.0
    p_drop: 0.02
  constrained:
    comm_range: 25.0
    p_drop: 0.15
  lossy:
    comm_range: 20.0
    p_drop: 0.30

fleet_sizes: [4]
task_counts: [15]
default_comm_range: 30.0
default_p_drop: 0.10
contingency_depth: 1
