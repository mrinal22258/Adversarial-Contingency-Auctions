<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="#f8fafc" rx="8"/>
  <text x="600" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Fig. 2. Heterogeneous Robot Fleet Specifications &amp; Strategic Adversary Behavioral Policy Space (θ*)</text>

  <!-- COLUMN 1: Fleet Specifications -->
  <g transform="translate(35, 55)" filter="url(#shadow)">
    <rect width="360" height="375" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="8" fill="#2563eb"/>
    <rect y="24" width="360" height="10" fill="#2563eb"/>
    <text x="180" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(a) Heterogeneous Robot Fleet Capabilities</text>

    <!-- Scout Robot Card -->
    <g transform="translate(15, 48)">
      <rect width="330" height="145" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="15" y="24" font-size="13" font-weight="700" fill="#1d4ed8">▲ Scout Robot (High Mobility / Recon)</text>
      <text x="15" y="46" font-size="11" fill="#334155">• <b>Speed Factor:</b> 2.0× nodes / tick</text>
      <text x="15" y="66" font-size="11" fill="#334155">• <b>Sensing Radius (s_r):</b> 2 hops (Graph exploration)</text>
      <text x="15" y="86" font-size="11" fill="#334155">• <b>Comm Budget (κ_r):</b> 100 bits / tick (Broadcast relay)</text>
      <text x="15" y="106" font-size="11" fill="#334155">• <b>Battery Capacity:</b> 120.0 units (Low drain: 1.0/tick)</text>
      <text x="15" y="126" font-size="11" fill="#1e40af"><b>Primary Role:</b> Fast reconnaissance &amp; prior refinement P(θ)</text>
    </g>

    <!-- Heavy Lifter Card -->
    <g transform="translate(15, 208)">
      <rect width="330" height="145" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="15" y="24" font-size="13" font-weight="700" fill="#6d28d9">■ Heavy Lifter Robot (Payload / Execution)</text>
      <text x="15" y="46" font-size="11" fill="#334155">• <b>Speed Factor:</b> 1.0× nodes / tick</text>
      <text x="15" y="66" font-size="11" fill="#334155">• <b>Sensing Radius (s_r):</b> 1 hop (Local observation)</text>
      <text x="15" y="86" font-size="11" fill="#334155">• <b>Comm Budget (κ_r):</b> 40 bits / tick</text>
      <text x="15" y="106" font-size="11" fill="#334155">• <b>Battery Capacity:</b> 300.0 units (Move cost factor: 6.0)</text>
      <text x="15" y="126" font-size="11" fill="#5b21b6"><b>Primary Role:</b> High-value task fulfillment &amp; transport</text>
    </g>
  </g>

  <!-- COLUMN 2: Adversary Behavioral Policies -->
  <g transform="translate(420, 55)" filter="url(#shadow)">
    <rect width="360" height="375" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="8" fill="#dc2626"/>
    <rect y="24" width="360" height="10" fill="#dc2626"/>
    <text x="180" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(b) Strategic Adversary Policy Space (θ*)</text>

    <!-- Policy 1 -->
    <g transform="translate(15, 48)">
      <rect width="330" height="92" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#991b1b">θ_1: Stochastic Jammer (Random Disruptor)</text>
      <text x="15" y="42" font-size="11" fill="#334155">• Blockage Model: P(X_e = 1 | θ_1) = P_base</text>
      <text x="15" y="60" font-size="11" fill="#334155">• Uniform non-targeted mutations across risky edges E_risk</text>
      <text x="15" y="78" font-size="10" fill="#b91c1c">Evaluates baseline contingency detour resiliency</text>
    </g>

    <!-- Policy 2 -->
    <g transform="translate(15, 150)">
      <rect width="330" height="100" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#991b1b">θ_2: Reactive Path Blocker (Proximity Jammer)</text>
      <text x="15" y="42" font-size="11" fill="#334155">• Blockage Model: P(X_e = 1 | θ_2) = min(1.0, P_base + α N_e)</text>
      <text x="15" y="60" font-size="11" fill="#334155">• Triggered when robot enters influence radius (dist ≤ 1 hop)</text>
      <text x="15" y="78" font-size="11" fill="#334155">• Traversal weight mutates dynamically: w_e → ∞</text>
      <text x="15" y="94" font-size="10" fill="#b91c1c">Tests dynamic contingency switching &amp; Bayesian likelihoods</text>
    </g>

    <!-- Policy 3 -->
    <g transform="translate(15, 260)">
      <rect width="330" height="95" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#991b1b">θ_3: Optimal Minimax Adversary</text>
      <text x="15" y="42" font-size="11" fill="#334155">• Strategic target selection: argmax_e (Social Welfare Loss)</text>
      <text x="15" y="60" font-size="11" fill="#334155">• Maximizes simultaneous fleet bottlenecks (up to 8 blocks)</text>
      <text x="15" y="78" font-size="10" fill="#b91c1c">Stress-tests decentralized market under severe partitioning</text>
    </g>
  </g>

  <!-- COLUMN 3: Local Beliefs & KL Regularization -->
  <g transform="translate(805, 55)" filter="url(#shadow)">
    <rect width="360" height="375" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="360" height="34" rx="8" fill="#0891b2"/>
    <rect y="24" width="360" height="10" fill="#0891b2"/>
    <text x="180" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(c) Inconsistent Beliefs &amp; Regularization</text>

    <!-- Bayesian Filter Box -->
    <g transform="translate(15, 48)">
      <rect width="330" height="145" rx="6" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#0e7490">Bayesian Adversary Posterior Update</text>
      <text x="15" y="44" font-size="11" fill="#334155">P_r(θ_j | X_e) = [P_r(X_e | θ_j) P_r(θ_j)] / Σ_k P_r(X_e | θ_k)P_r(θ_k)</text>
      <text x="15" y="68" font-size="11" fill="#334155">• <b>Subjective Priors:</b> B_r = [P_r(θ_1), P_r(θ_2)]</text>
      <text x="15" y="88" font-size="11" fill="#334155">• <b>Theory of Mind:</b> Inferred peer belief Q^(r)(θ_j)</text>
      <text x="15" y="108" font-size="11" fill="#334155">• <b>Belief Divergence:</b> σ_θ = StdDev across robot fleet</text>
      <text x="15" y="128" font-size="10" fill="#0e7490">Guarantees convergence as observations accumulate</text>
    </g>

    <!-- Pinsker Margin Box -->
    <g transform="translate(15, 208)">
      <rect width="330" height="145" rx="6" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
      <text x="15" y="22" font-size="12" font-weight="700" fill="#0e7490">Pinsker Claim Margin (Theorem 3)</text>
      <text x="15" y="46" font-size="11" font-weight="700" fill="#1e1b4b">m_{r,j} = Δ_j · √(½ D̂_r) + δ_map</text>
      <text x="15" y="70" font-size="11" fill="#334155">• <b>Safe Claim:</b> ĉ_r^r(j) + m_{r,j} &lt; min_{s≠r} ĉ_s^r(j)</text>
      <text x="15" y="90" font-size="11" fill="#334155">• Derived from Pinsker's inequality: TV ≤ √(½ KL)</text>
      <text x="15" y="110" font-size="11" fill="#334155">• <b>Effect:</b> Provably eliminates conflicting task claims</text>
      <text x="15" y="130" font-size="10" fill="#047857">Guarantees conflict-freedom without belief synchronization</text>
    </g>
  </g>
</svg>
