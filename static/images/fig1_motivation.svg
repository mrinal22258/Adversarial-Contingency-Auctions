<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 480" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <linearGradient id="grad-fail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="grad-aca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1260" height="480" fill="#f8fafc" rx="8"/>
  <text x="630" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Fig. 1. Motivating Comparison: Classical Decentralized Auctions vs. Proposed ACA Framework under Adversarial Blockages</text>

  <!-- PANEL A: Baseline Auction Failure -->
  <g transform="translate(45, 60)" filter="url(#card-shadow)">
    <rect width="535" height="390" rx="8" fill="url(#grad-fail)" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="535" height="36" rx="8" fill="#ef4444"/>
    <rect y="26" width="535" height="10" fill="#ef4444"/>
    <text x="267" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(a) Classical Decentralized Auction (CBBA / SSI): Cascading Reset Failure</text>

    <!-- Graph Nodes -->
    <circle cx="90" cy="120" r="16" fill="#3b82f6"/>
    <text x="90" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">R1</text>
    <text x="90" y="95" text-anchor="middle" font-size="11" fill="#1e293b">Start (v1)</text>

    <circle cx="270" cy="120" r="14" fill="#64748b"/>
    <text x="270" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">v2</text>

    <circle cx="450" cy="120" r="16" fill="#10b981"/>
    <text x="450" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">T1</text>
    <text x="450" y="95" text-anchor="middle" font-size="11" fill="#1e293b">Task Goal (v3)</text>

    <!-- Primary Path with Blockage -->
    <line x1="106" y1="120" x2="256" y2="120" stroke="#2563eb" stroke-width="3"/>
    <line x1="284" y1="120" x2="434" y2="120" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Adversary Jammer Icon / Explosion -->
    <g transform="translate(350, 100)">
      <polygon points="10,0 14,8 24,9 16,16 19,25 10,20 1,25 4,16 -4,9 6,8" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
      <text x="10" y="38" text-anchor="middle" font-size="10" font-weight="700" fill="#b91c1c">BLOCKED</text>
    </g>

    <!-- Failure Cascade Box -->
    <rect x="25" y="175" width="485" height="185" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
    <text x="40" y="202" font-size="12" font-weight="700" fill="#991b1b">⚠️ Cascading Auction Breakdown Sequence:</text>
    <text x="40" y="226" font-size="11" fill="#334155">1. Robot R1 reaches blocked edge (v2 → v3), invalidating planned single path.</text>
    <text x="40" y="248" font-size="11" fill="#334155">2. R1 drops Task T1 and broadcasts global market nullification to peer fleet.</text>
    <text x="40" y="270" font-size="11" fill="#dc2626" font-weight="600">3. Entire fleet forced into expensive, multi-round consensus re-auction.</text>
    <text x="40" y="292" font-size="11" fill="#dc2626" font-weight="600">4. Under partitioned / jammed comms: Out-of-sync allocations &amp; fleet stalls.</text>
    
    <g transform="translate(40, 312)">
      <rect width="455" height="36" rx="4" fill="#fee2e2"/>
      <text x="227" y="23" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Result: 68% Task Completion, High Communication Spikes (&gt;75 msgs)</text>
    </g>
  </g>

  <!-- PANEL B: Proposed ACA Framework -->
  <g transform="translate(645, 60)" filter="url(#card-shadow)">
    <rect width="535" height="390" rx="8" fill="url(#grad-aca)" stroke="#86efac" stroke-width="1.5"/>
    <rect width="535" height="36" rx="8" fill="#10b981"/>
    <rect y="26" width="535" height="10" fill="#10b981"/>
    <text x="267" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">(b) Proposed ACA Framework: Autonomous Contingency Tree Activation</text>

    <!-- Graph Nodes -->
    <circle cx="90" cy="115" r="16" fill="#3b82f6"/>
    <text x="90" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">R1</text>
    <text x="90" y="90" text-anchor="middle" font-size="11" fill="#1e293b">Start (v1)</text>

    <circle cx="240" cy="115" r="14" fill="#64748b"/>
    <text x="240" y="119" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">v2</text>

    <circle cx="450" cy="115" r="16" fill="#10b981"/>
    <text x="450" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">T1</text>
    <text x="450" y="90" text-anchor="middle" font-size="11" fill="#1e293b">Task Goal (v3)</text>

    <!-- Detour Node -->
    <circle cx="345" cy="165" r="14" fill="#06b6d4"/>
    <text x="345" y="169" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">v4</text>
    <text x="345" y="190" text-anchor="middle" font-size="10" fill="#0e7490">Contingency</text>

    <!-- Blocked direct path -->
    <line x1="106" y1="115" x2="226" y2="115" stroke="#2563eb" stroke-width="3"/>
    <line x1="254" y1="115" x2="434" y2="115" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4"/>

    <!-- Detour contingency branch -->
    <path d="M 240 129 L 333 160" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>
    <path d="M 357 160 L 438 125" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arr-green)"/>

    <!-- Adversary Jammer Icon -->
    <g transform="translate(330, 95)">
      <polygon points="10,0 14,8 24,9 16,16 19,25 10,20 1,25 4,16 -4,9 6,8" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    </g>

    <!-- ACA Resilience Sequence -->
    <rect x="25" y="200" width="485" height="160" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
    <text x="40" y="224" font-size="12" font-weight="700" fill="#065f46">✅ ACA Autonomous Contingency Resolution:</text>
    <text x="40" y="246" font-size="11" fill="#334155">1. Precomputed Contingency Detour Tree pre-calculates branch (v2 → v4 → v3).</text>
    <text x="40" y="266" font-size="11" fill="#334155">2. R1 detects blockage, updates Bayesian prior P(θ*), and pivots locally to v4.</text>
    <text x="40" y="286" font-size="11" fill="#059669" font-weight="600">3. Zero global re-auction messages sent; market allocation stays intact.</text>
    <text x="40" y="306" font-size="11" fill="#059669" font-weight="600">4. Pinsker claim margin m_{r,j} guarantees conflict-freedom (Theorem 3).</text>
    
    <g transform="translate(40, 322)">
      <rect width="455" height="30" rx="4" fill="#dcfce7"/>
      <text x="227" y="20" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">Result: Provable Conflict-Freedom, Zero-Message Pivots, Bounded Overhead</text>
    </g>
  </g>
</svg>
