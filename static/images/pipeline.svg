<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-fleet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-auction" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-belief" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-adv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="grad-exec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f8fafc" rx="8"/>
  <rect x="15" y="15" width="1170" height="590" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="8"/>

  <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Adversarial Contingency Auctions (ACA) Architecture Pipeline</text>
  <text x="600" y="74" text-anchor="middle" font-size="13" fill="#64748b">Decentralized Multi-Robot Task Allocation with Inconsistent-Belief Modeling &amp; Adversarial Path Blockages</text>

  <!-- 1. FLEET BLOCK -->
  <g transform="translate(45, 105)" filter="url(#shadow)">
    <rect width="240" height="230" rx="8" fill="url(#grad-fleet)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="38" rx="8" fill="#3b82f6"/>
    <rect x="0" y="28" width="240" height="10" fill="#3b82f6"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1. Heterogeneous Fleet</text>
    
    <rect x="15" y="50" width="210" height="75" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="25" y="70" font-size="12" font-weight="700" fill="#1e40af">▲ Scout Robots (Fast)</text>
    <text x="25" y="88" font-size="11" fill="#475569">• High Speed (2.0x), Range = 2</text>
    <text x="25" y="104" font-size="11" fill="#475569">• Comm Budget = 100 bits/tick</text>
    <text x="25" y="118" font-size="10" fill="#64748b">  Low Payload / Scouting Focus</text>

    <rect x="15" y="135" width="210" height="80" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="25" y="155" font-size="12" font-weight="700" fill="#1e40af">■ Heavy Lifters (Payload)</text>
    <text x="25" y="173" font-size="11" fill="#475569">• Large Battery (300 Units)</text>
    <text x="25" y="189" font-size="11" fill="#475569">• Move Cost Factor = 6.0</text>
    <text x="25" y="205" font-size="10" fill="#64748b">  Task Execution &amp; Transport</text>
  </g>

  <!-- 2. AUCTION ENGINE BLOCK -->
  <g transform="translate(340, 105)" filter="url(#shadow)">
    <rect width="250" height="230" rx="8" fill="url(#grad-auction)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="38" rx="8" fill="#8b5cf6"/>
    <rect x="0" y="28" width="250" height="10" fill="#8b5cf6"/>
    <text x="125" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2. Decentralized Market</text>
    
    <rect x="15" y="50" width="220" height="165" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="25" y="72" font-size="12" font-weight="700" fill="#5b21b6">Sequential Single-Item (SSI)</text>
    <text x="25" y="90" font-size="11" fill="#475569">• Marginal Bid Calculation: c_ij</text>
    <text x="25" y="106" font-size="11" fill="#475569">• Consensus Iterations (CBBA)</text>
    <text x="25" y="124" font-size="12" font-weight="700" fill="#5b21b6">Disagreement Penalty (κ)</text>
    <text x="25" y="142" font-size="11" fill="#475569">• Inconsistent-Belief Regularizer</text>
    <text x="25" y="158" font-size="11" fill="#475569">• Bundle Size Constraint (k ≤ 5)</text>
    <text x="25" y="174" font-size="11" fill="#475569">• Comm Range &amp; Out-of-Sync Tracking</text>
    <text x="25" y="196" font-size="10" font-weight="600" fill="#7c3aed">Market Clearing: Winning Bids Allocated</text>
  </g>

  <!-- 3. STRATEGIC ADVERSARY BLOCK -->
  <g transform="translate(645, 105)" filter="url(#shadow)">
    <rect width="240" height="230" rx="8" fill="url(#grad-adv)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="38" rx="8" fill="#ef4444"/>
    <rect x="0" y="28" width="240" height="10" fill="#ef4444"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3. Strategic Adversary (θ*)</text>
    
    <rect x="15" y="50" width="210" height="165" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
    <text x="25" y="72" font-size="12" font-weight="700" fill="#991b1b">Adversary Behavioral Policies</text>
    <text x="25" y="90" font-size="11" fill="#475569">• θ_1: Stochastic Jammer</text>
    <text x="25" y="106" font-size="11" fill="#475569">• θ_2: Reactive Path Blocker</text>
    <text x="25" y="122" font-size="11" fill="#475569">• θ_3: Optimal Minimax Adversary</text>
    <text x="25" y="142" font-size="12" font-weight="700" fill="#991b1b">Dynamic Topology Mutations</text>
    <text x="25" y="160" font-size="11" fill="#475569">• Max Active Blockages: E_block</text>
    <text x="25" y="176" font-size="11" fill="#475569">• Proximity Trigger (Radius ≤ 1)</text>
    <text x="25" y="196" font-size="10" font-weight="600" fill="#b91c1c">Graph Edge Traversal Cost → ∞</text>
  </g>

  <!-- 4. DYNAMIC EXECUTION & COMPLETION -->
  <g transform="translate(940, 105)" filter="url(#shadow)">
    <rect width="215" height="230" rx="8" fill="url(#grad-exec)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="38" rx="8" fill="#10b981"/>
    <rect x="0" y="28" width="215" height="10" fill="#10b981"/>
    <text x="107" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4. Mission Execution</text>
    
    <rect x="12" y="50" width="190" height="165" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="22" y="72" font-size="12" font-weight="700" fill="#065f46">Dynamic Re-routing</text>
    <text x="22" y="90" font-size="11" fill="#475569">• Real-Time Path Recalculation</text>
    <text x="22" y="106" font-size="11" fill="#475569">• Obstacle Avoidance Trajectory</text>
    <text x="22" y="126" font-size="12" font-weight="700" fill="#065f46">Mission Performance</text>
    <text x="22" y="144" font-size="11" fill="#475569">• Task Reward Collection (R_j)</text>
    <text x="22" y="160" font-size="11" fill="#475569">• Deadline Adherence (t ≤ D_j)</text>
    <text x="22" y="176" font-size="11" fill="#475569">• Social Welfare Maximization</text>
    <text x="22" y="196" font-size="10" font-weight="600" fill="#047857">✓ Verified Task Completion</text>
  </g>

  <!-- 5. BOTTOM FEEDBACK & CONTINGENCY BRANCHING -->
  <g transform="translate(180, 385)" filter="url(#shadow)">
    <rect width="840" height="185" rx="8" fill="url(#grad-belief)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="840" height="34" rx="8" fill="#0891b2"/>
    <rect x="0" y="24" width="840" height="10" fill="#0891b2"/>
    <text x="420" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5. Subjective Belief Filtering &amp; Contingency Branching Layer</text>
    
    <g transform="translate(20, 45)">
      <rect width="250" height="120" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="1"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#0e7490">Bayesian Adversary Filter</text>
      <text x="15" y="44" font-size="11" fill="#475569">• Prior: P(θ_1)=0.5, P(θ_2)=0.5</text>
      <text x="15" y="62" font-size="11" fill="#475569">• Observation: Likelihood L(o|θ)</text>
      <text x="15" y="80" font-size="11" fill="#475569">• Posterior Recursive Update</text>
      <text x="15" y="98" font-size="10" fill="#64748b">  Quantifies Subjective Inconsistency</text>
    </g>

    <g transform="translate(290, 45)">
      <rect width="260" height="120" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="1"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#0e7490">Contingency Planning Trees</text>
      <text x="15" y="44" font-size="11" fill="#475569">• Primary Path: Optimal under P(θ)</text>
      <text x="15" y="62" font-size="11" fill="#475569">• Contingency Branch: Sub-tree if blocked</text>
      <text x="15" y="80" font-size="11" fill="#475569">• Expected Cost: E[Cost | Tree, θ]</text>
      <text x="15" y="98" font-size="10" fill="#64748b">  Prevents Auction Cascade Failures</text>
    </g>

    <g transform="translate(570, 45)">
      <rect width="250" height="120" rx="6" fill="#ffffff" stroke="#cffafe" stroke-width="1"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#0e7490">Teammate Belief Modeling</text>
      <text x="15" y="44" font-size="11" fill="#475569">• Nested Belief Estimates: B_i(B_j(θ))</text>
      <text x="15" y="62" font-size="11" fill="#475569">• Belief Divergence Tracking (StdDev)</text>
      <text x="15" y="80" font-size="11" fill="#475569">• Out-of-Sync Allocation Recovery</text>
      <text x="15" y="98" font-size="10" fill="#64748b">  Guarantees Fleet Resiliency</text>
    </g>
  </g>

  <!-- CONNECTING ARROWS & LABELS -->
  <path d="M 285 190 L 332 190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="312" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">Bids</text>

  <path d="M 590 190 L 637 190" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="615" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">Routes</text>

  <path d="M 885 190 L 932 190" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="910" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Mutation</text>

  <path d="M 1047 335 L 1047 477 L 1028 477" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="1062" y="410" text-anchor="start" font-size="10" font-weight="600" fill="#059669">Observations</text>

  <path d="M 180 477 L 130 477 L 130 343" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="100" y="420" text-anchor="middle" font-size="10" font-weight="600" fill="#0e7490">State Update</text>

  <path d="M 465 385 L 465 343" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <text x="495" y="365" text-anchor="start" font-size="10" font-weight="600" fill="#0e7490">Contingency Valuations</text>
</svg>
