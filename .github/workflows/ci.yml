name: CI

on:
  push:
    branches: [ main, master, audit-remediation, fix/audit-repairs ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-protocol:
    name: Lint & Protocol Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install ruff
          pip install -e .
      - name: Run Ruff Lint
        run: |
          ruff check .
        continue-on-error: true
      - name: Verify Protocol v6
        run: |
          python tools/verify_protocol.py --config experiments/configs/protocol_v6.yaml --strict
      - name: Strict Paper Linter
        run: |
          python tools/lint_paper.py

  test-core:
    name: Core Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install -e .
      - name: Run Core Test Suite
        run: |
          pytest -v -m "not (sitl or ortools or ui)"

  test-api:
    name: Demo & API Endpoints Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Demo Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-demo.txt
          pip install -e .
      - name: Run API Tests
        run: |
          pytest -v tests/test_api_endpoints.py

  test-extras:
    name: Extras Suite (SITL, OR-Tools, UI)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Extras Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run Full Test Suite
        run: |
          pytest -v
