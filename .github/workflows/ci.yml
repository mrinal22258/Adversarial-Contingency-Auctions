name: CI

on:
  push:
    branches: [ main, fix/audit-repairs ]
  pull_request:
    branches: [ main ]

jobs:
  test-core:
    name: Core Suite (No Extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run Core Test Suite
        run: |
          pytest -v -m "not (sitl or ortools or ui)"

  test-extras:
    name: Extras Suite (SITL, OR-Tools, UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Extras Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[all]"
          pip install pytest
      - name: Run Full Test Suite
        run: |
          pytest -v
